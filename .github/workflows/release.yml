name: release

# Push a tag such as v1.0.0 -> builds, tests, creates a GitHub Release with the desktop designer + packages,
# and (if the NUGET_API_KEY secret exists) pushes the packages to nuget.org.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet build -c Release
      - run: dotnet test tests/KSC.Excel.Tests -c Release --no-build
      - run: dotnet test tests/KSC.Excel.Pdf.Tests -c Release --no-build
      - run: dotnet pack -c Release --no-build -o artifacts/nuget -p:ContinuousIntegrationBuild=true

      - name: Desktop designer zips
        shell: pwsh
        run: |
          dotnet publish src/KSC.Excel.Designer.Windows -c Release -f net10.0-windows -r win-x64 --self-contained false -o artifacts/d10
          dotnet publish src/KSC.Excel.Designer.Windows -c Release -f net48 -o artifacts/d48
          Compress-Archive artifacts/d10/* artifacts/KSC.Excel.Designer-net10-win-x64.zip
          Compress-Archive artifacts/d48/* artifacts/KSC.Excel.Designer-net48.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/nuget/*.nupkg
            docs/guide/*.pdf

      - name: Push to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
