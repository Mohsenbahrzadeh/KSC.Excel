name: Bug report
description: Something renders wrongly or fails
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: template
    attributes:
      label: Template JSON and data shape (remove private data)
      render: json
  - type: dropdown
    id: output
    attributes:
      label: Output
      options: [xlsx, PDF, HTML preview/viewer, designer UI, other]
  - type: input
    id: env
    attributes:
      label: Environment
      description: ".NET version / .NET Framework, OS, browser (designer), package version"
