<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<base href="{{BASE}}/">
<link rel="stylesheet" href="assets/designer.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="3" fill="#217346"/><path d="M7 8l4 8M11 8l-4 8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M14 9h5M14 12h5M14 15h5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".85"/></svg>
      <span id="app-title">{{TITLE}}</span>
    </div>
    <input id="tpl-name" type="text" maxlength="99" spellcheck="false" autocomplete="off">
    <span id="dirty" title=""></span>
    <div class="spacer"></div>
    <div id="top-actions"></div>
  </header>
  <div id="ribbon"></div>
  <div id="formulabar"><span id="cell-addr">A1</span><span class="fxlbl">fx</span><input id="formula-input" type="text" spellcheck="false" autocomplete="off"></div>
  <div id="main">
    <aside id="left-panel"><div class="tabs" id="left-tabs"></div><div class="tabbody" id="left-body"></div></aside>
    <section id="gridarea">
      <div id="gridscroll"><div id="gridwrap" tabindex="0"></div></div>
      <div id="sheetbar"><div id="sheet-tabs"></div><div class="spacer"></div><div id="statusline"></div></div>
    </section>
    <aside id="right-panel"><div class="tabs" id="right-tabs"></div><div class="tabbody" id="right-body"></div></aside>
  </div>
</div>
<div id="ctxmenu"></div>
<div id="popover"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="assets/core.js"></script>
<script src="assets/grid.js"></script>
<script src="assets/panels.js"></script>
<script src="assets/designer.js"></script>
</body>
</html>
